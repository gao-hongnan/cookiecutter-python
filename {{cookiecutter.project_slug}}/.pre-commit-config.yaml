# Shared by prek and pre-commit — same config format, so switching runners
# needs no edits here. This project runs {{ cookiecutter.hooks_runner }} (see HOOKS_RUNNER in the Makefile).
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: [--strict]
{% if cookiecutter.use_docker %}

  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        language: docker_image
        entry: hadolint/hadolint:v2.15.1 hadolint
        files: (^|/)Dockerfile(\..+)?$
        pass_filenames: true
{% endif %}

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--fix", "--config", ".markdownlint.json"]
        exclude: ^(node_modules|\.venv|\.claude|(.*/)?_build)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: Ruff Lint
        args: [--fix]
      - id: ruff-format
        name: Ruff Format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock

  # Pre-push only — tests + type checkers are too slow for every commit
  # (typecheck runs mypy + pyright + ty + pyrefly). Runs once before push,
  # catching breakage before it leaves the machine. Bypass with
  # `git push --no-verify` if you really need to push a WIP branch.
  - repo: local
    hooks:
      - id: pytest
        name: Run pytest suite
        language: system
        entry: make test
        pass_filenames: false
        stages: [pre-push]
      - id: typecheck
        name: Run type checkers (mypy + pyright + ty + pyrefly)
        language: system
        entry: make typecheck
        pass_filenames: false
        stages: [pre-push]
