[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
authors = [{name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"}]
readme = "README.md"
license = "{{ cookiecutter.license }}"
license-files = ["LICENSE"]
requires-python = ">={{ cookiecutter.python_version }}"
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: {{ cookiecutter.python_version }}",
    "Typing :: Typed",
]

dependencies = [
{%- if cookiecutter.use_pydantic %}
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
{%- endif %}
{%- if cookiecutter.use_fastapi %}
    "fastapi[standard]~=0.162",
    "uvicorn~=0.54",
{%- endif %}
{%- if cookiecutter.use_database %}
    "sqlalchemy[asyncio]~=2.1",
    "sqlmodel~=0.0.48",
    "alembic~=1.20",
    "asyncpg~=0.32",
{%- endif %}
{%- if cookiecutter.use_cli %}
    "typer~=0.27",
    "rich~=15.0",
{%- endif %}
]

[dependency-groups]
lint = [
    "bandit~=1.9",
    "commitizen~=4.19",
    "pip-audit~=2.10",
{%- if cookiecutter.hooks_runner == "prek" %}
    "prek~=0.5.9",
{%- else %}
    "pre-commit~=4.7",
{%- endif %}
    "ruff~=0.17",
    "yamllint~=1.38",
]

type = [
    "mypy~=2.4",
    "pyright~=1.1.414",
    "ty~=0.0.95",
    "pyrefly~=1.4",
    "types-pyyaml~=6.0.12",
]

test = [
    "coverage~=7.17",
    "hypothesis>=6.170",
    "pytest~=9.2",
    "pytest-asyncio~=1.4",
    "pytest-benchmark~=5.3",
    "pytest-cov~=7.1",
    "pytest-memray>=1.11; sys_platform != 'win32'",
    "pytest-mock~=3.17",
    "pytest-xdist~=3.8",
    "testcontainers>=4.15",
]
{% if cookiecutter.use_jupyter_book %}

docs = [
    "jupyter-book~=2.1",
]
{% endif %}

dev = [
    {include-group = "lint"},
    {include-group = "type"},
    {include-group = "test"},
{%- if cookiecutter.use_jupyter_book %}
    {include-group = "docs"},
{%- endif %}
]

{% if cookiecutter.use_cli  %}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.package_name }}.cli:app"
{% endif %}

[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}"
Repository = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}"
Issues = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}/issues"

[tool.hatch.build.targets.wheel]
packages = ["{{ cookiecutter.package_name }}"]

[tool.uv]
managed = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
changelog_incremental = true

[tool.bandit]
exclude_dirs = [".eggs", ".git", ".hg", ".mypy_cache", ".tox", "venv", ".venv", "build", "dist"]

# Note: pytest, ty, and pyrefly configurations are in separate files:
# - .pytest.ini
# - ty.toml
# - pyrefly.toml
