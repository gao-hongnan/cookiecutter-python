name: PyPI Release

on:
  push:
    tags: ["v*"]

env:
  UV_FROZEN: true
  UV_SYSTEM_CERTS: "true"
  FORCE_COLOR: 1

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          # No cache in the publish job: a poisoned cache could tamper with the built artifact.
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME}"
          awk "/^## ${VERSION} /{flag=1; next} /^## v/{flag=0} flag" \
            CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf "See [CHANGELOG.md](CHANGELOG.md) for details.\n" > release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: {% raw %}${{ github.token }}{% endraw %}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md
