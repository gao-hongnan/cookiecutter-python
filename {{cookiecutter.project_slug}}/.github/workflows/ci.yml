name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: {% raw %}${{ github.ref != 'refs/heads/main' }}{% endraw %}

env:
  COLUMNS: 120
  UV_FROZEN: true
  UV_SYSTEM_CERTS: "true"
  FORCE_COLOR: 1

jobs:
  ci:
    name: CI Python {% raw %}${{ matrix.python-version }}{% endraw %} on {% raw %}${{ matrix.os }}{% endraw %}
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["{{ cookiecutter.python_version }}"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Keep in step with the markdownlint-cli rev in .pre-commit-config.yaml.
      - run: npm install -g markdownlint-cli@0.50.0

      - uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          python-version: {% raw %}${{ matrix.python-version }}{% endraw %}
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run CI Pipeline
        run: make ci

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-{% raw %}${{ matrix.os }}-${{ matrix.python-version }}{% endraw %}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
